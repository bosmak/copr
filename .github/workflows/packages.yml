name: packages

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  discover:
    runs-on: ubuntu-24.04
    outputs:
      packages: ${{ steps.find.outputs.pkgs }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - id: find
        run: |
          all_pkgs=$(find . -mindepth 2 -maxdepth 2 -name '*.spec' \
            -printf '%h\n' | sed 's|^\./||' | sort -u | paste -sd, -)
          echo "All packages: $all_pkgs" >&2

          if [ "${{ github.event_name }}" = 'pull_request' ]; then
            base="${{ github.event.pull_request.base.sha }}"
          else
            base="${{ github.event.before }}"
          fi

          # First push (no parent) or force-push with no usable diff
          # (event.before points at an unreachable SHA) → rebuild every
          # package.
          if [ -z "$base" ] \
             || [ "$base" = "0000000000000000000000000000000000000000" ] \
             || ! git cat-file -e "$base" 2>/dev/null; then
            build_pkgs="$all_pkgs"
          else
            changed=$(git diff --name-only "$base" "${{ github.sha }}" 2>/dev/null || true)
            # Belt-and-suspenders: if the diff came back empty for any
            # reason, treat as a full rebuild.
            if [ -z "$changed" ]; then
              build_pkgs="$all_pkgs"
            else
              echo "Changed files: $changed" >&2

            build_pkgs=""

            # Workflow changes affect every package's build — rebuild all.
            if printf '%s\n' "$changed" | grep -qE '^\.github/'; then
              build_pkgs="$all_pkgs"
            fi

            # Otherwise only rebuild packages whose own files changed.
            # README.md / description changes only affect the COPR project
            # metadata (rendered in update-copr), not package builds.
            for d in $(echo "$all_pkgs" | tr ',' ' '); do
              if printf '%s\n' "$changed" | grep -q "^$d/"; then
                build_pkgs="$build_pkgs,$d"
              fi
            done
            fi
          fi

          build_pkgs=$(echo "$build_pkgs" | tr ',' '\n' | grep -v '^$' | sort -u)
          if [ -z "$build_pkgs" ]; then
            build_pkgs_json='[]'
          else
            build_pkgs_json=$(printf '%s\n' "$build_pkgs" | jq -R . | jq -cs .)
          fi
          echo "pkgs=$build_pkgs_json" >> "$GITHUB_OUTPUT"
          echo "Selected for build: $build_pkgs" >&2
          echo "All packages: $all_pkgs" >&2

  publish:
    needs: [discover, update-copr]
    if: >-
      always() &&
      needs.discover.result == 'success' &&
      needs.discover.outputs.packages != '[]' &&
      (needs.update-copr.result == 'success' ||
       needs.update-copr.result == 'skipped')
    strategy:
      fail-fast: false
      matrix:
        pkg: ${{ fromJSON(needs.discover.outputs.packages) }}
    runs-on: ubuntu-24.04
    container:
      image: fedora:44
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Cache dnf
        uses: actions/cache@v5
        with:
          path: /var/cache/dnf
          key: dnf-fedora-44-v3
          restore-keys: dnf-fedora-44-

      - name: deps
        # No Go/Rust toolchains — both packages ship prebuilt upstream
        # binaries. Add golang/cargo/rust back here only if a future
        # package needs to compile from source.
        run: dnf install -y rpm-build rpmlint systemd-rpm-macros copr-cli jq

      - name: Stage upstream source and generate vendor tarball
        env:
          PKG_DIR: ${{ matrix.pkg }}
        run: |
          set -eu
          spec=$(ls "$PKG_DIR"/*.spec)
          version=$(grep -m1 '^Version:' "$spec" | awk '{print $2}')

          mkdir -p /tmp/rpmbuild/SOURCES

          # Read every SourceN line that is a URL and download it into
          # SOURCES/. Local-file sources (no scheme) are handled by the
          # "Stage auxiliary package files" step below.
          #
          # For each URL: substitute %{version} (rpm macros aren't
          # expanded when reading the spec directly; bash ${var//pat/rep}
          # would mangle the URL because '{' is a glob brace). Strip any
          # '#/filename' fragment when computing the basename, but use
          # the fragment as the on-disk filename if present (matching
          # RPM's behavior).
          awk '
            /^Source[0-9]+:[[:space:]]+https?:/ {
              sub(/^Source[0-9]+:[[:space:]]+/, "")
              print
            }
          ' "$spec" | while IFS= read -r url; do
              [ -z "$url" ] && continue
              resolved=$(printf '%s' "$url" | sed "s|%{version}|$version|g")
              url_no_frag="${resolved%%#*}"
              fname="$(basename "$url_no_frag")"
              if [[ "$resolved" == *#/* ]]; then
                  fname="${resolved#*#/}"
              fi
              echo "Fetching $resolved -> SOURCES/$fname"
              curl -fsSL "$resolved" -o "/tmp/rpmbuild/SOURCES/$fname"
          done

          # If Source0 is a source tarball with a go.mod or Cargo.toml,
          # vendor its deps into a local tarball so the build can be
          # offline. The vendor tarball name is hardcoded to
          # "${PKG_DIR}-vendor.tar.xz" — independent of whatever Source1
          # happens to be used for in the spec (SHA256SUMS, sysusers
          # conf, etc.).
          src0_url=$(awk '/^Source0:/{$1=""; sub(/^[ \t]+/,""); print; exit}' "$spec")
          src0_resolved=$(printf '%s' "$src0_url" | sed "s|%{version}|$version|g")
          src0_fname="$(basename "${src0_resolved%%#*}")"
          [[ "$src0_resolved" == *#/* ]] && src0_fname="${src0_resolved#*#/}"

          if [[ "$src0_fname" == *.tar* ]] \
             && [ -f "/tmp/rpmbuild/SOURCES/$src0_fname" ]; then
              work=$(mktemp -d)
              tar -xf "/tmp/rpmbuild/SOURCES/$src0_fname" -C "$work" --strip-components=1 2>/dev/null || true
              vendor_tar="${PKG_DIR}-vendor.tar.xz"
              (
                  cd "$work"
                  if [ -f go.mod ]; then
                      go mod download
                      go mod vendor
                  elif [ -f Cargo.toml ]; then
                      cargo vendor
                  fi
                  if [ -d vendor ]; then
                      tar -cJf "/tmp/rpmbuild/SOURCES/$vendor_tar" vendor/
                  fi
              )
              rm -rf "$work"
          fi
          echo "Staged: $(ls /tmp/rpmbuild/SOURCES/)"

      - name: rpmlint
        run: rpmlint ${{ matrix.pkg }}/*.spec

      - name: Stage auxiliary package files
        env:
          PKG_DIR: ${{ matrix.pkg }}
        run: |
          # Recursively copy every file from the pkg dir into SOURCES/ except
          # the spec. This covers local Sources like systemd unit files,
          # sysusers confs, and vendored LICENSEs without having to enumerate
          # them in the workflow. Subdirectory structure in the pkg dir is
          # flattened: a file at 'pvpn/dist/pvpnd.service' lands at
          # SOURCES/pvpnd.service, so the spec can reference it by basename.
          mkdir -p /tmp/rpmbuild/SOURCES
          find "$PKG_DIR" -type f \! -name '*.spec' \
            -exec cp -t /tmp/rpmbuild/SOURCES/ {} +

      - name: rpmbuild -bs
        run: |
          mkdir -p /tmp/rpmbuild/{BUILD,RPMS,SOURCES,SPECS,SRPMS}
          cp ${{ matrix.pkg }}/*.spec /tmp/rpmbuild/SPECS/
          rpmbuild -bs \
            --define "_topdir /tmp/rpmbuild" \
            --define "_disable_source_fetch 0" \
            /tmp/rpmbuild/SPECS/${{ matrix.pkg }}.spec

      - name: Submit SRPM to COPR
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          COPR_LOGIN: ${{ secrets.COPR_LOGIN }}
          COPR_TOKEN: ${{ secrets.COPR_TOKEN }}
          COPR_OWNER: ${{ vars.COPR_OWNER }}
          COPR_PROJECT: ${{ vars.COPR_PROJECT }}
        run: |
          mkdir -p ~/.config
          {
            echo '[copr-cli]'
            echo "login = ${COPR_LOGIN}"
            echo "username = ${COPR_OWNER}"
            echo "token = ${COPR_TOKEN}"
            echo 'copr_url = https://copr.fedorainfracloud.org'
          } > ~/.config/copr
          srpm=$(ls /tmp/rpmbuild/SRPMS/*.src.rpm | head -1)
          echo "Uploading $srpm to $COPR_OWNER/$COPR_PROJECT"
          copr-cli build "$COPR_PROJECT" --nowait "$srpm"

  update-copr:
    # Run on push to main so README/description-only commits still
    # refresh the COPR project metadata. Doesn't trigger a package rebuild.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: discover
    runs-on: ubuntu-24.04
    container:
      image: fedora:44
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: deps
        run: dnf install -y copr-cli jq
      - name: Auth with COPR
        env:
          COPR_LOGIN: ${{ secrets.COPR_LOGIN }}
          COPR_TOKEN: ${{ secrets.COPR_TOKEN }}
          COPR_OWNER: ${{ vars.COPR_OWNER }}
          COPR_PROJECT: ${{ vars.COPR_PROJECT }}
        run: |
          mkdir -p ~/.config
          {
            echo '[copr-cli]'
            echo "login = ${COPR_LOGIN}"
            echo "username = ${COPR_OWNER}"
            echo "token = ${COPR_TOKEN}"
            echo 'copr_url = https://copr.fedorainfracloud.org'
          } > ~/.config/copr
      - name: Ensure COPR project exists
        env:
          COPR_OWNER: ${{ vars.COPR_OWNER }}
          COPR_PROJECT: ${{ vars.COPR_PROJECT }}
        run: |
          if copr-cli get "$COPR_PROJECT" >/dev/null 2>&1; then
            echo "COPR project '$COPR_OWNER/$COPR_PROJECT' already exists."
          else
            echo "Creating COPR project '$COPR_OWNER/$COPR_PROJECT'..."
            copr-cli create "$COPR_PROJECT" \
              --chroot fedora-rawhide-x86_64 \
              --chroot fedora-44-x86_64 \
              --chroot fedora-43-x86_64 \
              --description "Personal COPR packages"
            echo "Created."
          fi
      - name: Update COPR project metadata
        env:
          COPR_PROJECT: ${{ vars.COPR_PROJECT }}
        run: |
          desc=$(cat description)
          instr=$(cat install_instructions)
          # Print for the job log only — "$instr" holds the file *contents*,
          # so it must not be passed to cat as a filename.
          printf '%s\n' "$instr"
          copr-cli modify "$COPR_PROJECT" \
            --description "$desc" \
            --instructions "$instr"
