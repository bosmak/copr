name: auto-update

on:
  schedule:
    - cron: '0 6 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  upstream-check:
    runs-on: ubuntu-24.04
    container:
      image: fedora:44
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: deps
        run: dnf install -y git gh jq python3 curl-minimal

      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Auto-discover and update packages
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          git config user.name  'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'

          # Packages maintained in this repository have no separate upstream
          # to check. Their versions are bumped manually and published by the
          # packages workflow when the change is merged.
          owned_packages=(
            steam-fix-trayicon
          )

          is_owned_package() {
            local package="$1"
            local owned
            for owned in "${owned_packages[@]}"; do
              [ "$package" = "$owned" ] && return 0
            done
            return 1
          }

          derive_upstream() {
            local spec="$1"
            local first_gh
            first_gh=$(awk '
              /^Source[0-9]+:[[:space:]]+https?:/ {
                sub(/^Source[0-9]+:[[:space:]]+/, "")
                if ($0 ~ /^https?:\/\/(github\.com|raw\.githubusercontent\.com)\//) {
                  print
                  exit
                }
              }
            ' "$spec")
            [ -z "$first_gh" ] && return 1

            local repo
            repo=$(printf '%s' "$first_gh" \
              | sed -nE 's#^https?://(github\.com|raw\.githubusercontent\.com)/([^/?#]+/[^/?#]+).*#\2#p')
            [ -z "$repo" ] && return 1

            local prefix
            prefix=$(printf '%s' "$first_gh" | awk '
              {
                if (match($0, /\/releases\/download\/[^%/]+%\{version\}/)) {
                  s = substr($0, RSTART, RLENGTH)
                  sub(/.*\/releases\/download\//, "", s)
                  sub(/%\{version\}.*/, "", s)
                  print s
                  exit
                }
                if (match($0, /\/archive\/refs\/tags\/[^%/]+%\{version\}/)) {
                  s = substr($0, RSTART, RLENGTH)
                  sub(/.*\/archive\/refs\/tags\//, "", s)
                  sub(/%\{version\}.*/, "", s)
                  print s
                  exit
                }
              }
            ')
            [ -z "$prefix" ] && return 1

            printf '%s|%s\n' "$repo" "$prefix"
          }

          while IFS= read -r spec; do
            [ -z "$spec" ] && continue
            pkg=$(basename "$(dirname "$spec")")

            if is_owned_package "$pkg"; then
              echo "::notice::$pkg is maintained in this repository; skipping upstream update check."
              continue
            fi

            echo "::group::$pkg"

            current=$(grep -m1 '^Version:' "$spec" | awk '{print $2}')
            if [ -z "$current" ]; then
              echo "::warning::No 'Version:' tag in $spec; skipping."
              echo "::endgroup::"
              continue
            fi

            if ! upstream=$(derive_upstream "$spec"); then
              echo "::warning::$pkg: could not infer upstream. Spec has no Source line matching /releases/download/<prefix>%{version} or /archive/refs/tags/<prefix>%{version}."
              echo "::endgroup::"
              continue
            fi
            repo="${upstream%%|*}"
            tag_prefix="${upstream##*|}"

            echo "Upstream: $repo   tag_prefix='$tag_prefix'   Spec: $current"

            release=$(gh api "repos/$repo/releases/latest")
            tag=$(jq -r '.tag_name' <<<"$release")
            upstream_version=${tag#"$tag_prefix"}

            if [ -z "$upstream_version" ] || [ "$upstream_version" = "$tag" ]; then
              echo "::error::$pkg: prefix '$tag_prefix' didn't strip from tag '$tag' (repo $repo)."
              exit 1
            fi

            if [ "$current" = "$upstream_version" ]; then
              echo "Up-to-date."
              echo "::endgroup::"
              continue
            fi

            echo "Update available: $current -> $upstream_version"

            branch="auto-update/$pkg-$upstream_version"
            # Anchor local main at origin/main so each auto-update
            # branch is a clean delta against the real main, not
            # against a previous in-run commit.
            git checkout -B main origin/main
            git checkout -b "$branch"

            if grep -q 'rpm2archive' "$spec"; then
              python3 .github/scripts/rebundle.py refresh "$pkg" "$upstream_version"
              extra_body="\n- The spec was regenerated from the upstream RPM."
            else
              extra_body=""
              awk \
                -v version="$upstream_version" \
                -v today="$(date -u +'%a %b %d %Y')" \
                -v bot='github-actions[bot] <github-actions[bot]@users.noreply.github.com>' '
                  {
                    if (/^Version:/ && !done) {
                      sub(/^Version:.*/, "Version:        " version)
                      done = 1
                    } else if (/^Release:/ && !r_done) {
                      sub(/^Release:.*/, "Release:        1%{?dist}")
                      r_done = 1
                    } else if (/^%changelog/) {
                      print
                      print "* " today " " bot " - " version "-1"
                      print "- update to " version
                      print ""
                      next
                    }
                    print
                  }
                ' "$spec" > "$spec.tmp" && mv "$spec.tmp" "$spec"
            fi

            if git diff --quiet; then
              echo "::warning::No diff after rewrite; bailing."
              git checkout -B main origin/main
              echo "::endgroup::"
              continue
            fi

            git add "$spec"
            git commit -m "auto-update($pkg): $current -> $upstream_version"
            git push -u origin "$branch"

            gh pr create \
              --base main \
              --head "$branch" \
              --title "auto-update($pkg): $current -> $upstream_version" \
              --body "Upstream [$repo](https://github.com/$repo) released [\`$tag\`](https://github.com/$repo/releases/tag/$tag).

          - Current spec version: \`$current\`
          - New spec version:     \`$upstream_version\`$extra_body

          Triggered by the \`auto-update\` workflow. Once you merge this PR, the existing \`packages\` workflow rebuilds the package in COPR.

          ---

          🤖 Automated." \
              || true

            git checkout -B main origin/main
            echo "::endgroup::"
          done < <(find . -mindepth 2 -maxdepth 2 -name '*.spec' | sort)
