[Service]
# Hide Steam's own tray indicator (id "steam").  It is an AppIndicator that
# always opens Steam's popup menu on click, so it cannot open the Steam
# window.  The replacement indicator ("steam-window") is provided by
# steam-fix-trayicon.service and opens the window on a double click.
#
# Only relevant for DankMaterialShell; harmless for everyone else.
Environment=DMS_HIDE_TRAYIDS=steam
